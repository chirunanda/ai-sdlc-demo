name: AI failure triage

# Runs after CI fails: reads the failed job logs, asks Claude for the likely cause and fix,
# and posts it on the PR (or the run summary for pushes to main).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # checks out the default branch: scripts are trusted code
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download failed job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed.log || true
      - name: Triage with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: node scripts/ai/triage.mjs --file failed.log --kind ci --title "CI run #$RUN_NUMBER"
