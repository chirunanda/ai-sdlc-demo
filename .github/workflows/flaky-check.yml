name: Flaky test check

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per suite
        default: "5"

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: bff
      - name: Repeat suites
        env:
          RUNS: ${{ inputs.runs || '5' }}
        run: ./scripts/flaky-check.sh "$RUNS"
