# Runs on every `git commit`. Setup (once):
#   pip install pre-commit actionlint-py cfn-lint yamllint shellcheck-py
#   (shellcheck-py lets actionlint check the shell inside workflow steps, as GitHub's runner does)
#   pre-commit install
# Run on all files any time:  pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint (GitHub Actions workflows)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: cfn-lint
        name: cfn-lint (CloudFormation)
        entry: cfn-lint
        language: system
        files: ^infra/.*\.ya?ml$
      - id: yamllint
        name: yamllint (YAML syntax)
        entry: yamllint
        language: system
        files: \.(ya?ml)$
      - id: shellcheck
        name: shellcheck (deploy scripts)
        entry: shellcheck
        language: system
        files: ^scripts/.*\.sh$
