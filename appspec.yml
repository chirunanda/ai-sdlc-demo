version: 0.0
os: linux

files:
  - source: api/catalog-api.jar
    destination: /opt/app/api
  - source: bff
    destination: /opt/app/bff
  - source: web
    destination: /opt/app/web
  - source: config
    destination: /opt/app/config

file_exists_behavior: OVERWRITE

hooks:
  # Note: ApplicationStop runs the script from the PREVIOUS successful revision.
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
  # A non-zero exit here fails the deployment and triggers the automatic rollback.
  ValidateService:
    - location: scripts/validate.sh
      timeout: 120
      runas: root
